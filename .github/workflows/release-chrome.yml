name: Release Chrome

# Builds the Chrome zip and attaches it to a GitHub Release for the pushed
# tag. Push a tag that matches apps/extension/extension/manifest.json, e.g.:
#   git tag v1.0.2 && git push origin v1.0.2
# This also fires release-firefox.yml and release-edge.yml (same trigger) —
# together they build all three browsers' zips onto ONE shared release.
# Running just this one manually (workflow_dispatch) only builds/attaches
# the Chrome zip, not the other two.
#
# No Chrome Web Store submission yet — that needs a one-time $5 developer
# registration fee that hasn't been paid, plus a Chrome Web Store API
# wiring pass once it has. Until then this just builds the zip for manual
# "Load unpacked" sideloading (or a future manual dashboard upload).
on:
  push:
    tags:
      - v*
  workflow_dispatch:

# Shared group name with release-firefox.yml/release-edge.yml — see that
# file's comment for why (serializes writes to the same GitHub Release).
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(node -p "require('./apps/extension/extension/manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v${TAG} does not match apps/extension/extension/manifest.json version ${VERSION}"
            exit 1
          fi

      - run: npm run package:chrome

      - name: Resolve release version
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./apps/extension/extension/manifest.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          files: apps/extension/web-ext-artifacts/azi-${{ steps.meta.outputs.version }}-chrome.zip
