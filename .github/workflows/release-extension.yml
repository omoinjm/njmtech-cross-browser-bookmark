name: Release extension

# Publishes a packaged extension zip to GitHub Releases.
# Push a tag that matches extension/manifest.json, e.g.:
#   git tag v1.0.2 && git push origin v1.0.2
# Or run manually from the Actions tab (uses manifest version as the tag).
on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(node -p "require('./extension/manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v${TAG} does not match extension/manifest.json version ${VERSION}"
            exit 1
          fi

      - run: npm run lint:firefox
      - run: npm run package:firefox

      - name: Resolve release version
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate packaged zip
        id: zip
        run: |
          ZIP=$(ls web-ext-artifacts/azi-*.zip)
          echo "path=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "Packaged: ${ZIP}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: Azi v${{ steps.meta.outputs.version }}
          files: ${{ steps.zip.outputs.path }}
          generate_release_notes: true
          body: |
            ## Azi browser extension v${{ steps.meta.outputs.version }}

            Download **`azi-${{ steps.meta.outputs.version }}.zip`** below and install:

            - **Firefox:** upload to AMO, or load temporarily via `about:debugging` → *Load Temporary Add-on*
            - **Chrome / Edge:** unzip and use *Load unpacked* in `chrome://extensions` (Developer mode), or sideload the zip if your browser supports it

            After installing, open the extension popup → **Account** tab to log in or request access.

            API endpoint: `https://api.bookmark.njmtech.co.za/api/v1`
