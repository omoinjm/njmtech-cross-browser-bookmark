name: Release extension

# Publishes a packaged extension zip to GitHub Releases, and submits the
# same build to addons.mozilla.org (AMO) for signing/review.
# Push a tag that matches apps/extension/extension/manifest.json, e.g.:
#   git tag v1.0.2 && git push origin v1.0.2
# Or run manually from the Actions tab (uses manifest version as the tag).
#
# AMO submission requires two repository secrets under Settings → Secrets
# and variables → Actions: AMO_JWT_ISSUER and AMO_JWT_SECRET (an API
# key/secret pair from https://addons.mozilla.org/developers/addon/api/key/).
#
# Microsoft Edge Add-ons submission requires three more: EDGE_CLIENT_ID,
# EDGE_API_KEY (both from Partner Center → Microsoft Edge → Publish API →
# Create API credentials) and EDGE_PRODUCT_ID (from the extension's page in
# Partner Center). The Edge API can only update an EXISTING listing, so the
# first submission must be done by hand in Partner Center before this can
# take over for subsequent versions.
#
# Any of these secrets missing just skips that store's step — the GitHub
# Release always publishes regardless. Opera Add-ons has no public
# submission API, so it stays a manual upload — see the README.
on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(node -p "require('./apps/extension/extension/manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v${TAG} does not match apps/extension/extension/manifest.json version ${VERSION}"
            exit 1
          fi

      - run: npm run lint:firefox
      - run: npm run package:firefox
      # Built unconditionally (not just when Edge secrets are set) so the
      # Chromium-flavored zip is always available on the GitHub Release for
      # manual Opera/Chrome/Edge sideloading, even before Edge automation
      # is configured.
      - run: npm run package:edge

      - name: Submit to AMO for signing/review
        if: ${{ env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != '' }}
        continue-on-error: true
        run: npm run publish:firefox

      - name: Submit to Microsoft Edge Add-ons
        if: ${{ env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != '' && env.EDGE_PRODUCT_ID != '' }}
        continue-on-error: true
        run: node apps/extension/scripts/publish-edge.js

      - name: Resolve release version
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./apps/extension/extension/manifest.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate packaged zip(s)
        id: zip
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          FILES="web-ext-artifacts/azi-${VERSION}.zip"
          if [ -f "web-ext-artifacts/azi-${VERSION}-edge.zip" ]; then
            FILES="${FILES}
          web-ext-artifacts/azi-${VERSION}-edge.zip"
          fi
          echo "Packaged:"
          echo "$FILES"
          {
            echo "paths<<ZIP_EOF"
            echo "$FILES"
            echo "ZIP_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: Azi v${{ steps.meta.outputs.version }}
          files: ${{ steps.zip.outputs.paths }}
          generate_release_notes: true
          body: |
            ## Azi browser extension v${{ steps.meta.outputs.version }}

            Two zips below — they're **not interchangeable** (Chromium's package validator rejects a couple of things Firefox's manifest needs):

            - **`azi-${{ steps.meta.outputs.version }}.zip`** — Firefox build.
              - Submitted to AMO automatically for review, or load it temporarily via `about:debugging` → *Load Temporary Add-on*.
            - **`azi-${{ steps.meta.outputs.version }}-edge.zip`** — Chromium build (Edge, Opera, Chrome).
              - **Microsoft Edge:** submitted to Edge Add-ons automatically for review (once the listing exists), or unzip and use *Load unpacked* in `edge://extensions` (Developer mode).
              - **Opera:** upload this zip manually at [addons.opera.com/developer](https://addons.opera.com/developer/) — no public submission API exists for Opera.
              - **Chrome:** unzip and use *Load unpacked* in `chrome://extensions` (Developer mode) — not yet published to the Chrome Web Store.

            After installing, open the extension popup → **Account** tab to log in or request access.

            API endpoint: `https://api.bookmark.njmtech.co.za/api/v1`
