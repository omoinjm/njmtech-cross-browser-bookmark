name: Release Firefox

# Builds the Firefox zip, submits it to addons.mozilla.org (AMO) for
# signing/review, and attaches it to a GitHub Release for the pushed tag.
# Push a tag that matches apps/extension/extension/manifest.json, e.g.:
#   git tag v1.0.2 && git push origin v1.0.2
# This also fires release-chrome.yml and release-edge.yml (same trigger) —
# together they build all three browsers' zips onto ONE shared release.
# Running just this one manually (workflow_dispatch) only builds/attaches
# the Firefox zip, not the other two.
#
# AMO submission requires two repository secrets under Settings → Secrets
# and variables → Actions: AMO_JWT_ISSUER and AMO_JWT_SECRET (an API
# key/secret pair from https://addons.mozilla.org/developers/addon/api/key/).
# Missing secrets just skip that step — the GitHub Release step still runs.
#
# This workflow owns the release's name/body/generated notes (the other two
# omit them entirely) — softprops/action-gh-release leaves fields untouched
# when a caller omits them, so it doesn't matter which of the three runs
# first; the release ends up with this body regardless of order.
on:
  push:
    tags:
      - v*
  workflow_dispatch:

# Shared group name with release-chrome.yml/release-edge.yml — GitHub
# enforces concurrency groups repo-wide across different workflow files, so
# this serializes all three release-touching jobs for the same tag and
# avoids a create-vs-create race on the shared GitHub Release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(node -p "require('./apps/extension/extension/manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v${TAG} does not match apps/extension/extension/manifest.json version ${VERSION}"
            exit 1
          fi

      - run: npm run lint:firefox
      - run: npm run package:firefox

      - name: Submit to AMO for signing/review
        if: ${{ env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != '' }}
        continue-on-error: true
        run: npm run publish:firefox

      - name: Resolve release version
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./apps/extension/extension/manifest.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: Azi v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: apps/extension/web-ext-artifacts/azi-${{ steps.meta.outputs.version }}.zip
          body: |
            ## Azi browser extension v${{ steps.meta.outputs.version }}

            Three zips on this release — they're **not interchangeable** (Chromium's package validator rejects a couple of things Firefox's manifest needs):

            - **`azi-${{ steps.meta.outputs.version }}.zip`** — Firefox build. Submitted to AMO automatically for review, or load it temporarily via `about:debugging` → *Load Temporary Add-on*.
            - **`azi-${{ steps.meta.outputs.version }}-edge.zip`** — Microsoft Edge build. Submitted to Edge Add-ons automatically for review (once the listing exists), or unzip and use *Load unpacked* in `edge://extensions` (Developer mode).
            - **`azi-${{ steps.meta.outputs.version }}-chrome.zip`** — Chrome build (identical Chromium package to the Edge one, just named for its own store). Not yet published to the Chrome Web Store — unzip and use *Load unpacked* in `chrome://extensions` (Developer mode). Also works for Opera's manual upload at [addons.opera.com/developer](https://addons.opera.com/developer/), since Opera is Chromium-based too and has no public submission API.

            After installing, open the extension popup → **Account** tab to log in or request access.

            API endpoint: `https://api.bookmark.njmtech.co.za/api/v1`
