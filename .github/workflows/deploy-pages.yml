name: Deploy Pages

# Separate from deploy.yml (the Worker's build/typecheck/test/deploy
# pipeline) — this covers a different concern (the static marketing site),
# needs different permissions, and has no Cloudflare secrets involved.
on:
  push:
    branches: [main]
    paths: ['apps/website/**']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website
      - id: deployment
        uses: actions/deploy-pages@v4
