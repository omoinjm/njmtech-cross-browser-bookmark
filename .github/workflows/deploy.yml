name: Deploy

on:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run typecheck

  build:
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the Worker bundle without publishing it (no Cloudflare
      # credentials needed) — catches real bundling failures (bad imports,
      # unresolvable modules) that type-checking alone wouldn't.
      - run: npm run build

  cross-browser-test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chrome/Edge: drives the real unpacked extension in Chromium (Edge
      # shares its engine and the manifest key this project uses for it).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:extension
      # Firefox: not driven live (no equivalent simple "load this unpacked
      # extension" flag for Firefox automation) — Mozilla's own linter
      # checks manifest.json/code against Firefox's WebExtension rules
      # instead, which catches real cross-browser incompatibilities.
      - run: npm run lint:firefox

  deploy:
    needs: [cross-browser-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
