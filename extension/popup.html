<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bookmark Sync Engine</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Bookmark Sync Engine</h1>

    <div id="tab-bar" role="tablist">
      <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab="import" hidden>Import</button>
      <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab="suggest" hidden>Suggest</button>
      <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab="search" hidden>Search</button>
      <button class="tab-btn active" type="button" role="tab" aria-selected="true" data-tab="account">Account</button>
    </div>

    <section id="tab-import" class="tab-panel" role="tabpanel" hidden>
      <button id="import-btn" type="button">Import all bookmarks</button>
      <button id="library-btn" type="button">View library</button>
      <p id="progress"></p>

      <label class="ai-toggle">
        <input id="suggest-category-toggle" class="ai-toggle-input" type="checkbox" />
        <span class="ai-toggle-track">
          <span class="ai-toggle-knob"></span>
          <span class="ai-toggle-text ai-toggle-text-off">OFF</span>
          <span class="ai-toggle-text ai-toggle-text-on">ON</span>
        </span>
        <span class="ai-toggle-label">Suggest categories for unfiled bookmarks (AI)</span>
      </label>

      <h2>Recent activity</h2>
      <ul id="activity-list"></ul>
      <p id="empty-state">Nothing synced yet.</p>
    </section>

    <section id="tab-suggest" class="tab-panel" role="tabpanel" hidden>
      <button id="suggest-reorg-btn" type="button">Suggest reorganization</button>
      <p id="reorg-status"></p>
      <ul id="reorg-list"></ul>
      <div id="reorg-actions" hidden>
        <button id="reorg-apply-btn" type="button">Apply selected</button>
        <button id="reorg-cancel-btn" type="button">Cancel</button>
      </div>
    </section>

    <section id="tab-search" class="tab-panel" role="tabpanel" hidden>
      <input id="search-input" type="search" placeholder="Search bookmarks…" autocomplete="off" />
      <label class="ai-toggle">
        <input id="semantic-search-toggle" class="ai-toggle-input" type="checkbox" />
        <span class="ai-toggle-track">
          <span class="ai-toggle-knob"></span>
          <span class="ai-toggle-text ai-toggle-text-off">OFF</span>
          <span class="ai-toggle-text ai-toggle-text-on">ON</span>
        </span>
        <span class="ai-toggle-label">AI search (semantic — finds bookmarks by meaning, not just matching words)</span>
      </label>
      <p id="search-status"></p>
      <ul id="search-results"></ul>
    </section>

    <section id="tab-account" class="tab-panel" role="tabpanel">
      <div id="account-logged-in" hidden>
        <p>Logged in as <strong id="account-email"></strong></p>
        <button id="logout-btn" type="button">Log out</button>
      </div>

      <div id="account-logged-out">
        <h2>Log in</h2>
        <form id="login-form">
          <input id="login-email" type="email" placeholder="Email" autocomplete="username" required />
          <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required />
          <button type="submit">Log in</button>
        </form>
        <p id="login-status"></p>
        <button id="send-access-btn" type="button">Send access token</button>

        <div id="send-access-panel" hidden>
          <p class="account-hint">No password to choose — we'll email you one.</p>
          <form id="send-access-form">
            <input id="send-access-email" type="email" placeholder="Email" autocomplete="email" required />
            <button type="submit">Send me a password</button>
          </form>
          <p id="send-access-status"></p>
        </div>
      </div>
    </section>

    <script src="browser-polyfill.js"></script>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
