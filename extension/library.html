<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bookmark Library</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <header>
      <h1>Bookmark Library</h1>
      <input id="search-input" type="search" placeholder="Search bookmarks…" autocomplete="off" />
      <div class="header-actions">
        <button id="import-file-btn" class="header-btn" type="button">Import file</button>
        <input id="import-file-input" type="file" accept=".html,text/html" hidden />
        <button id="export-btn" class="header-btn" type="button">Export</button>
        <button id="add-bookmark-btn" type="button">+ Add</button>
      </div>
    </header>

    <!-- Adds to the Library directly, then mirrors it into this browser's
         native bookmarks (see background.js's writeNativeCreate). The
         reverse direction — a native bookmark syncing to the Library — is
         background.js's onCreated listener. -->
    <form id="add-bookmark-form" class="add-bookmark-panel" hidden>
      <label class="form-row">
        <span>URL</span>
        <input id="add-url" type="url" required placeholder="https://…" autocomplete="off" />
      </label>
      <label class="form-row">
        <span>Title</span>
        <input id="add-title" type="text" placeholder="(optional — scraped automatically if left blank)" autocomplete="off" />
      </label>
      <label class="form-row">
        <span>Category</span>
        <input id="add-category" type="text" list="category-options" placeholder="(optional, e.g. Dev Tools/AI)" autocomplete="off" />
      </label>
      <div class="form-actions">
        <span id="add-status"></span>
        <button type="button" id="add-cancel-btn">Cancel</button>
        <button type="submit" id="add-submit-btn">Add bookmark</button>
      </div>
    </form>

    <datalist id="category-options"></datalist>

    <p id="import-banner" hidden></p>

    <div class="layout">
      <nav id="sidebar">
        <h2 class="collapsible" id="categories-toggle" data-target="category-nav" aria-expanded="true">Categories</h2>
        <div id="category-nav">
          <button class="nav-btn active" type="button" data-category="">All</button>
          <ul id="category-tree" class="tree"></ul>
        </div>

        <h2 class="collapsible" id="tags-toggle" data-target="tag-nav" aria-expanded="false">Tags</h2>
        <div id="tag-nav" class="collapsed"></div>
      </nav>

      <main>
        <div id="bookmark-view">
          <p id="status-line"></p>
          <ul id="bookmark-list"></ul>
          <p id="empty-state">No bookmarks yet — import some from the popup.</p>
          <button id="load-more-btn" type="button" hidden>Load more</button>
        </div>
      </main>
    </div>

    <script src="browser-polyfill.js"></script>
    <script src="config.js"></script>
    <script src="library.js"></script>
  </body>
</html>
