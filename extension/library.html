<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bookmark Library</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <header>
      <h1>Bookmark Library</h1>
      <input id="search-input" type="search" placeholder="Search bookmarks…" autocomplete="off" />
    </header>

    <p id="import-banner" hidden></p>

    <div class="layout">
      <nav id="sidebar">
        <h2 class="collapsible" id="categories-toggle" data-target="category-nav" aria-expanded="true">Categories</h2>
        <div id="category-nav">
          <button class="nav-btn active" type="button" data-category="">All</button>
          <ul id="category-tree" class="tree"></ul>
        </div>

        <button id="suggest-reorg-btn" class="sidebar-action" type="button">Suggest reorganization</button>

        <h2 class="collapsible" id="tags-toggle" data-target="tag-nav" aria-expanded="false">Tags</h2>
        <div id="tag-nav" class="collapsed"></div>
      </nav>

      <main>
        <div id="reorg-panel" hidden>
          <h2>Suggested Reorganization</h2>
          <p id="reorg-status"></p>
          <ul id="reorg-list"></ul>
          <div id="reorg-actions" hidden>
            <button id="reorg-apply-btn" type="button">Apply selected</button>
            <button id="reorg-cancel-btn" type="button">Cancel</button>
          </div>
        </div>

        <div id="bookmark-view">
          <p id="status-line"></p>
          <ul id="bookmark-list"></ul>
          <p id="empty-state">No bookmarks yet — import some from the popup.</p>
          <button id="load-more-btn" type="button" hidden>Load more</button>
        </div>
      </main>
    </div>

    <script src="browser-polyfill.js"></script>
    <script src="config.js"></script>
    <script src="library.js"></script>
  </body>
</html>
