name = "bookmark-sync-engine"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# --- Custom domain ---------------------------------------------------------
# Requires njmtech.co.za to be an active zone on this Cloudflare account.
routes = [
  { pattern = "api.bookmark.njmtech.co.za", custom_domain = true }
]

# --- D1 (SQLite) database -----------------------------------------------
# Create with: wrangler d1 create bookmarks-db
# Then paste the returned database_id below.
[[d1_databases]]
binding       = "DB"
database_name = "bookmarks-db"
database_id   = "be8c0f80-7417-499a-9c75-8a4a0f3f91b8"

# --- Workers AI -----------------------------------------------------------
# No setup needed beyond having Workers AI enabled on the account.
[ai]
binding = "AI"

# --- Browser Rendering ------------------------------------------------------
# Gives the Worker a real headless Chromium instance via @cloudflare/puppeteer.
[browser]
binding = "BROWSER"

# --- Vectorize (semantic search) -------------------------------------------
# Create with: wrangler vectorize create bookmarks-embeddings --dimensions=768 --metric=cosine
# 768 dimensions matches @cf/baai/bge-base-en-v1.5 (see services/embedding-
# generator.ts) — changing that model means recreating this index.
[[vectorize]]
binding    = "VECTORIZE"
index_name = "bookmarks-embeddings"

# --- Scheduled embedding backfill -------------------------------------------
# Catches anything the live per-bookmark embedding call missed (a transient
# failure) plus any backlog from before semantic search existed, without
# relying on someone remembering to call POST /api/v1/admin/backfill-embeddings
# by hand — see the `scheduled` handler in src/index.ts and
# services/embedding-backfill.ts.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
